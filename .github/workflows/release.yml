name: Release

# Pushing a tag like v0.1.0 builds the disk image and publishes a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: xcode-27 # needs the macOS 27 SDK
    steps:
      - uses: actions/checkout@v4

      - name: Build disk image
        run: VERSION="${GITHUB_REF_NAME#v}" UNIVERSAL=1 ./scripts/make-dmg.sh

      # The notes come from this version's section in CHANGELOG.md.
      - name: Extract release notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '/^## /{p = ($2 == v); next} p' CHANGELOG.md > build/notes.md
          if ! grep -q '[^[:space:]]' build/notes.md; then
            echo "CHANGELOG.md has no section for $VERSION" >&2
            exit 1
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/*.dmg --title "Constant ${GITHUB_REF_NAME#v}" --notes-file build/notes.md
