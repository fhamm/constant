name: Release

# Pushing a tag like v0.1.0 builds the disk image and publishes a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build disk image
        run: VERSION="${GITHUB_REF_NAME#v}" UNIVERSAL=1 ./scripts/make-dmg.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/*.dmg --title "Constant ${GITHUB_REF_NAME#v}" --generate-notes
